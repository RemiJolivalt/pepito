name: Delegation risk progress

on:
  push:
    branches: [main]
    paths:
      - src/lib/delegation-risk.ts
      - src/lib/site/publish.ts
      - src/app/api/gmail/send/route.ts
      - src/app/api/proposals/**/execute/route.ts
      - src/components/proposal-card.tsx
      - tests/delegation.spec.ts
      - tests/user-journey.spec.ts
      - docs/domaines.md
      - docs/backlog.md
      - .github/workflows/delegation-risk-progress.yml
      - src/lib/delegation-policy.ts
      - src/app/admin/risques/**
      - src/app/admin/delegation-risk-settings.tsx
      - src/app/api/admin/delegation-risk/route.ts
      - prisma/schema.prisma
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delegation-risk-progress
  cancel-in-progress: false

jobs:
  update-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark del-5 in progress and record delivered scope
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.body?.includes('<!-- biendecider-us:del-5 -->'));
            if (!issue) throw new Error('Delegation risk US del-5 was not found among open Issues.');
            const marker = '<!-- delegation-risk-p1:server-guard-v3 -->';
            const labels = issue.labels.map(label => label.name).filter(name => !name.startsWith('status:'));
            labels.push('status:in-progress');
            await github.rest.issues.update({ ...context.repo, issue_number: issue.number, labels: [...new Set(labels)] });
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number, per_page: 100 });
            if (!comments.some(comment => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `${marker}\n## Tranche implementee le 2026-10-10\nClassification deterministe par type, avec facteurs explicites (exposition publique, communication externe, donnees de tiers, depense, irreversibilite), motif visible et type inconnu a risque eleve. Aucune action actuellement livree n'est classee faible. Les routes serveur de publication du site et d'envoi Gmail imposent Accompagner/confirmation ; un test appelle directement la route site non validee et verifie le refus sans ExecutionLog. CI, tests unitaires et recette navigateur passes.\n\n**Encore ouvert dans cette US :** decision des deux fondateurs sur les regles par action, persistance des modes autorises et contextes reels de depense/reversibilite. Aucun mode autonome n'est active.\n\nDetails : https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/domaines.md`
              });
            }